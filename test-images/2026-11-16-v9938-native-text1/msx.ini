# BlueberryMSX hardware-test configuration (SD data partition, emmc1-2).
# Copy this file to the data partition root as msx.ini.
#
# Under test: native V9938 TEXT1 40-column scanout, with both 8-dot borders,
# R#2/R#4 table selection, R#23 scroll and R#9 active-line selection.
# Prior sprite raster split, SCREEN 6/7 and TEXT2 fixes remain included.
# bootlog=on writes a rolling boot.log there; change to off to disable it.

# Logging: uart | off | file | net. With msxbus=on, UART pins are reserved
# for the cartridge bus and the application disables the serial logger.
log=uart
loglevel=info
bootlog=on

# Machine and cartridge behavior.
machine=msx2
cart.mapper=auto

# Physical RPMC cartridge connectors.
msxbus=on
msxbus.slot1=1
msxbus.slot3=2
msxbus.mode=cache
msxbus.rddelay=16

# Optional diagnostics are off to avoid extra SD writes or cartridge pokes.
diag=off
msxbus.dump=off
mfrprobe=off

# Upper bound and mapper policy for an explicitly enabled boot cartridge dump.
msxbus.size=0x80000
msxbus.dumpmapper=konamiscc

# ALT+F10 capture destination, relative to the SD data partition root.
# Create this directory on the card for capture/ files. If it is missing or
# unusable, files fall back to the data-partition root and boot.log says so.
capture.dir=capture
