#
# msx.ini - boot-time configuration for BlueberryMSX (bare metal)
#
# Read from the SD card DATA partition (2nd VFAT, "emmc1-2") right after
# it is mounted, then the boot sequence applies the chosen log mode. The
# RPMC bus owns GPIO 14/15 (IORQ/MREQ), which is the UART TX/RX pair - so
# whenever the bus is enabled the UART is turned off automatically and
# diagnostics accumulate in the RAM file-log buffer (see "log" below).
#
# Place this file on the data partition, NOT on the boot partition: the
# emulator writes CART*.ROM / frame dumps there too, and writing the boot
# partition corrupts the boot files.
#
# Keys:
#   log          where messages go: uart | off | file | net
#                uart = serial console (default, no bus in use)
#                off  = drop all log output
#                file = UART off, keep a RAM copy of the log
#                net  = same as "file" for now (network drain is later)
#                NOTE: the RAM copy is NOT yet persisted to boot.log - a
#                small-file FAT write hangs this kernel build (frames and
#                cart dumps work; a ~1 KB boot.log does not). The boot.log
#                flush is deferred while that is investigated.
#   loglevel     debug | info | warn | error | panic   (default info)
#   diag         on | off        diagnostic SD writes (default off). When on,
#                                captures a few PPM frames and bus-counter
#                                .STA files to the data partition; each write
#                                stalls the emulator, so leave off for play.
#   msxbus       on | off        attach the two physical RPMC connectors to
#                                the emulated cartridge slots, LIVE: every
#                                emulated read/write and every unclaimed I/O
#                                port goes to the real packs (a game in one
#                                slot, a music module/SCC/FM in the other)
#   msxbus.slot1 <0-3>           emulated primary slot for board connector 1
#                                (default 1)
#   msxbus.slot3 <0-3>           emulated primary slot for board connector 3
#                                (default 2; keep 3 reserved for system RAM)
#   msxbus.dump  on | off        boot diagnostic: dump connector1->CART1.ROM
#                                and connector3->CART3.ROM to the FAT
#                                partition (independent of the live hook)
#   msxbus.mode  live | cache    access strategy (default cache).
#                                cache = serve cartridge reads from a RAM
#                                copy, filled on first read and flushed on any
#                                write to the connector. Fast for plain ROM
#                                packs and write-driven (bank-register)
#                                mappers; use live for a mapper that switches
#                                banks on a *read*.
#   msxbus.rddelay <iters>       post-WAIT settle iterations for live memory
#                                reads (default 16). Applies to cache misses.
#                                The reference driver uses 100; WAIT normally
#                                signals data-ready, so a smaller value cuts
#                                per-read GPIO traffic. Raise toward 100 if a
#                                cartridge reads garbage.
#   msxbus.size  <bytes>         bytes to dump per slot (default 0x20000)
#   mfrprobe     on | off        boot-time MegaFlashROM SCC+ mapper probe
#                                (default off). When on, before C-BIOS boots
#                                the connector-1 cart is probed across every
#                                mapper mode (Konami-SCC/Konami/64K/ASCII8/
#                                ASCII16): each candidate bank register is
#                                written and the four 8 KiB page signatures are
#                                recorded to MFRPROBE.TXT on the data partition.
#                                The cart is then left in Konami mode. Use to
#                                find where a physical cart latches its banks.

log=file
loglevel=info
diag=on
msxbus=on
msxbus.slot1=1
msxbus.slot3=2
msxbus.dump=on
msxbus.mode=cache
msxbus.rddelay=16
msxbus.size=0x80000
mfrprobe=on
